name: Update coordinator checks
on:
  push:
    paths: ['probes/maintain_updates.py', 'probes/update_*.py', 'probes/build*_deb.py', 'probes/*_smoke.py', 'probes/launcher_eight_open.py', 'maintenance/**', 'tests/test_update*.py', '.github/workflows/maintenance-tests.yml']
  pull_request:
    paths: ['probes/maintain_updates.py', 'probes/update_*.py', 'probes/build*_deb.py', 'probes/*_smoke.py', 'probes/launcher_eight_open.py', 'maintenance/**', 'tests/test_update*.py', '.github/workflows/maintenance-tests.yml']
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_update*.py' -v
      - run: python -m py_compile probes/maintain_updates.py probes/update_package_spec.py probes/update_target_check.py probes/build_deb.py probes/build_office_deb.py probes/build_launcher_deb.py probes/deckcraft_smoke.py probes/launcher_eight_open.py
